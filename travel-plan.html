<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet"/><title>Travel Plan Generator</title><style>:root{--forest:#1a3a2a;--forest-mid:#2d5a40;--forest-light:#3d7a56;--gold:#b8954a;--gold-light:#d4aa6a;--gold-pale:#e8c98a;--cream:#faf8f2;--ink:#1a1a1a;--ink-mid:#3a3a3a;--border:#d4c9b0;--fp-bg:#16181a;--fp-bg2:#1c1f22;--fp-border:rgba(184,149,74,.18);--input-bg:rgba(255,255,255,.04);--input-border:rgba(255,255,255,.1);--input-focus:rgba(184,149,74,.4);--text-muted:rgba(255,255,255,.38)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Outfit,sans-serif;background:#0f1012;color:#e8e0d4}.app{display:grid;grid-template-columns:560px 1fr;min-height:100vh}.form-panel{background:linear-gradient(180deg,var(--fp-bg),var(--fp-bg2));border-right:1px solid var(--fp-border);height:100vh;overflow:auto}.form-header{padding:22px 26px 16px;border-bottom:1px solid var(--fp-border);background:rgba(184,149,74,.05);display:flex;gap:13px;align-items:center}.brand-icon{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;overflow:hidden}.brand-icon img{width:100%;height:100%;object-fit:contain}.form-header h1{font-family:"Cormorant Garamond",serif;color:var(--gold-light);font-size:22px}.form-header p{font-size:10px;color:var(--text-muted);letter-spacing:1.8px;text-transform:uppercase}.form-body{padding:16px 26px 22px}.section-label{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:18px 0 10px;padding-bottom:7px;border-bottom:1px solid rgba(184,149,74,.18)}.field{margin-bottom:10px}.field label{display:block;font-size:10px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.42);margin-bottom:4px}.field input,.field textarea,.field select{width:100%;background:var(--input-bg);border:1px solid var(--input-border);border-radius:5px;padding:9px 10px;font-family:Outfit;font-size:12.5px;color:#e8e0d4;outline:none}.field textarea{min-height:54px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--input-focus);background:rgba(255,255,255,.06)}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn-primary,.btn-secondary{width:100%;padding:12px 18px;border-radius:7px;font-family:Outfit;text-transform:uppercase;letter-spacing:1.3px;cursor:pointer}.btn-primary{background:linear-gradient(135deg,#22402e,#2d5a40);border:1px solid var(--gold);color:var(--gold-pale);font-weight:600}.btn-secondary{background:transparent;border:1px solid rgba(184,149,74,.28);color:var(--gold);margin-top:8px}.preview-panel{background:#1a1c1e;display:flex;flex-direction:column;align-items:center;padding:28px 16px;overflow:auto}.preview-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.28);margin-bottom:18px}.doc-page{width:794px;min-height:1123px;background:var(--cream);color:var(--ink);box-shadow:0 16px 60px rgba(0,0,0,.55);position:relative;overflow:hidden;display:flex;flex-direction:column}.topbar{height:5px;background:linear-gradient(90deg,var(--forest),var(--forest-mid),var(--gold),var(--gold-pale))}.watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-28deg);font-family:"Cormorant Garamond",serif;font-size:82px;font-weight:700;color:rgba(26,58,42,.04);letter-spacing:8px;white-space:nowrap}.doc-content{position:relative;z-index:1;flex:1;display:flex;flex-direction:column}.doc-header{padding:28px 36px 20px;border-bottom:1.5px solid var(--border);display:flex;justify-content:space-between;gap:20px}.hotel{display:flex;gap:14px}.logo-box{width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,var(--forest),var(--forest-light));overflow:hidden}.logo-box img{width:100%;height:100%;object-fit:cover}.hotel h2{font-family:"Cormorant Garamond",serif;font-size:25px;color:var(--forest);line-height:1.05}.hotel .meta{font-size:10.5px;color:var(--ink-mid);line-height:1.65;margin-top:6px}.badge{background:linear-gradient(135deg,var(--forest),var(--forest-mid));color:var(--gold-pale);font-family:"Cormorant Garamond",serif;font-size:17px;letter-spacing:3px;padding:7px 15px;border-radius:4px;text-transform:uppercase;display:inline-block}.meta-right{text-align:right;font-size:11px;color:var(--ink-mid);line-height:1.8}.band{padding:13px 36px;background:rgba(26,58,42,.035);border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:18px}.box h4{font-size:8.5px;letter-spacing:2px;text-transform:uppercase;color:var(--forest-light);margin-bottom:5px}.box p{font-size:12px;line-height:1.65;color:var(--ink-mid)}.box strong{color:var(--ink);font-size:14px}.content-block{padding:18px 36px;flex:1}.lux-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}.lux-table th{background:linear-gradient(90deg,var(--forest),var(--forest-mid));color:var(--gold-pale);text-align:left;padding:9px 10px;font-size:9px;letter-spacing:1.4px;text-transform:uppercase;font-weight:500}.lux-table td{padding:9px 10px;border-bottom:1px solid rgba(212,201,176,.55);color:var(--ink-mid);vertical-align:top}.lux-table td:last-child,.lux-table th:last-child{text-align:right}.totals{display:flex;justify-content:flex-end;padding:0 36px 14px}.totals-box{width:280px;border:1px solid var(--border);border-radius:5px;overflow:hidden}.total-row{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid rgba(212,201,176,.45);font-size:12px;color:var(--ink-mid)}.total-row.grand{background:linear-gradient(135deg,var(--forest),var(--forest-mid));color:var(--gold-pale);font-weight:600;font-size:14px}.section-title{font-family:"Cormorant Garamond",serif;font-size:20px;color:var(--forest);margin:14px 0 6px}.pill-list{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;margin-top:8px}.pill{font-size:11px;color:var(--ink-mid);padding:7px 9px;border-left:3px solid var(--forest-light);background:rgba(26,58,42,.04)}.footer{background:linear-gradient(90deg,var(--forest),var(--forest-mid));padding:12px 36px;display:flex;justify-content:space-between;align-items:center;color:rgba(255,255,255,.42);font-size:9.5px}.footer .msg{font-family:"Dancing Script",cursive;color:var(--gold-pale);font-size:18px}.back{display:block;color:var(--gold);text-decoration:none;font-size:11px;margin-top:10px;text-transform:uppercase;letter-spacing:1.5px}@media print{@page{size:A4;margin:0}body{background:#fff}.form-panel,.preview-label{display:none!important}.app{display:block}.preview-panel{padding:0;background:white}.doc-page{width:210mm;height:297mm;box-shadow:none}}@media(max-width:900px){.app{grid-template-columns:1fr}.form-panel{height:auto}.preview-panel{display:none}}</style></head><body><script>if(sessionStorage.getItem("mre_portal_unlocked")!=="yes"){window.location.href="index.html"}</script><div class="app"><aside class="form-panel"><div class="form-header"><div class="brand-icon"><img src="logo.png" onerror="this.style.display='none'"></div><div><h1>Travel Plan Generator</h1><p>Mountain Retreat Ecostay</p></div></div><div class="form-body"><a class="back" href="index.html">← Back to document studio</a><div class="section-label">Guest & Trip Details</div><div class="field-row"><div class="field"><label>Plan No.</label><input id="planNo" value="MRE-TRIP-001" oninput="updateDoc()"></div><div class="field"><label>Date</label><input type="date" id="planDate" oninput="updateDoc()"></div></div><div class="field"><label>Guest Name</label><input id="guestName" placeholder="e.g. Amit Kumar" oninput="updateDoc()"></div><div class="field-row"><div class="field"><label>Adults</label><input type="number" id="adults" value="2" oninput="updateDoc()"></div><div class="field"><label>Children</label><input type="number" id="children" value="1" oninput="updateDoc()"></div></div><div class="field-row"><div class="field"><label>Start Date</label><input type="date" id="startDate" oninput="updateDoc()"></div><div class="field"><label>Pickup / Drop</label><input id="pickup" value="NJP to NJP" oninput="updateDoc()"></div></div><div class="field"><label>Package Title</label><input id="title" value="Kalimpong Local Sightseeing Package" oninput="updateDoc()"></div><div class="section-label">Day-wise Itinerary</div><div class="field"><label>Day 1</label><textarea id="day1" oninput="updateDoc()">NJP pickup, transfer to Mountain Retreat Ecostay, welcome tea, evening leisure and mountain view.</textarea></div><div class="field"><label>Day 2</label><textarea id="day2" oninput="updateDoc()">Kalimpong local sightseeing: Delo Park, Durpin Monastery, Cactus Nursery, Morgan House, local market visit.</textarea></div><div class="field"><label>Day 3</label><textarea id="day3" oninput="updateDoc()">Breakfast, checkout and drop to NJP with sweet memories of the hills.</textarea></div><div class="section-label">Pricing</div><div class="field-row"><div class="field"><label>Adult Price / Person</label><input type="number" id="adultPrice" value="7700" oninput="updateDoc()"></div><div class="field"><label>Child Price</label><input type="number" id="childPrice" value="0" oninput="updateDoc()"></div></div><div class="field-row"><div class="field"><label>Car Cost</label><input type="number" id="carCost" value="3500" oninput="updateDoc()"></div><div class="field"><label>Advance</label><input type="number" id="advance" value="0" oninput="updateDoc()"></div></div><div class="field"><label>Inclusions</label><textarea id="inclusions" oninput="updateDoc()">Accommodation, breakfast, local sightseeing car, pickup and drop, basic travel assistance</textarea></div><div class="field"><label>Exclusions</label><textarea id="exclusions" oninput="updateDoc()">Lunch, dinner, entry tickets, personal expenses, anything not mentioned in inclusions</textarea></div><button class="btn-primary" onclick="window.print()">Print / Save PDF</button><button class="btn-secondary" onclick="location.reload()">Reset</button></div></aside><main class="preview-panel"><div class="preview-label">Live Travel Plan Preview</div><div class="doc-page"><div class="topbar"></div><div class="watermark">MRE</div><div class="doc-content" id="preview"></div></div></main></div><script>function v(id){return document.getElementById(id).value.trim()}function fmt(n){return new Intl.NumberFormat('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0)}function d(s){return s?new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—'}function list(text){return text.split(/[
,]+/).filter(Boolean).map(x=>`<div class="pill">${x.trim()}</div>`).join('')}function updateDoc(){let a=Number(v('adults'))||0,c=Number(v('children'))||0,ap=Number(v('adultPrice'))||0,cp=Number(v('childPrice'))||0,car=Number(v('carCost'))||0,adv=Number(v('advance'))||0,total=a*ap+c*cp+car,bal=Math.max(0,total-adv);let days=[v('day1'),v('day2'),v('day3')].map((x,i)=>`<tr><td style="width:75px"><b>Day ${i+1}</b></td><td>${x||'—'}</td></tr>`).join('');document.getElementById('preview').innerHTML=`<div class="doc-header"><div class="hotel"><div class="logo-box"><img src="logo.png"></div><div><h2>Mountain Retreat Ecostay</h2><div class="meta">Upper Chibbo, Kalimpong, West Bengal – 734301<br>📞 6202533268 / 8434779789<br>✉ ssecostay@gmail.com</div></div></div><div class="meta-right"><div class="badge">Travel Plan</div><br>Plan No. <b>${v('planNo')||'—'}</b><br>Date <b>${d(v('planDate'))}</b></div></div><div class="band"><div class="box"><h4>Prepared For</h4><p><strong>${v('guestName')||'Guest'}</strong><br>${a} Adult(s), ${c} Child(ren)</p></div><div class="box"><h4>Trip Summary</h4><p>${v('title')}<br>Start: <strong>${d(v('startDate'))}</strong><br>${v('pickup')}</p></div></div><div class="content-block"><div class="section-title">Day-wise Itinerary</div><table class="lux-table"><thead><tr><th>Day</th><th>Plan</th></tr></thead><tbody>${days}</tbody></table><div class="section-title">Inclusions</div><div class="pill-list">${list(v('inclusions'))}</div><div class="section-title">Exclusions</div><div class="pill-list">${list(v('exclusions'))}</div></div><div class="totals"><div class="totals-box"><div class="total-row"><span>Adult Cost</span><span>₹${fmt(a*ap)}</span></div><div class="total-row"><span>Child Cost</span><span>₹${fmt(c*cp)}</span></div><div class="total-row"><span>Car Cost</span><span>₹${fmt(car)}</span></div><div class="total-row"><span>Advance</span><span>− ₹${fmt(adv)}</span></div><div class="total-row grand"><span>Balance / Total</span><span>₹${fmt(bal)}</span></div></div></div><div class="footer"><div class="msg">Your hill journey, planned with care ✦</div><div>Mountain Retreat Ecostay</div></div>`}document.getElementById('planDate').value=new Date().toISOString().slice(0,10);updateDoc()</script></body></html>
