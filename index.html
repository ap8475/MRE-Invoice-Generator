<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mountain Retreat Ecostay — Invoice Generator</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Outfit:wght@300;400;500;600&family=Dancing+Script:wght@600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
      :root {
        --forest: #1a3a2a;
        --forest-mid: #2d5a40;
        --forest-light: #3d7a56;
        --gold: #b8954a;
        --gold-light: #d4aa6a;
        --gold-pale: #e8c98a;
        --cream: #faf8f2;
        --ink: #1a1a1a;
        --ink-mid: #3a3a3a;
        --ink-light: #6a6a6a;
        --border: #d4c9b0;

        /* Form panel — refined dark neutral, not heavy green */
        --fp-bg: #16181a;
        --fp-bg2: #1c1f22;
        --fp-border: rgba(184, 149, 74, 0.18);
        --fp-section: rgba(184, 149, 74, 0.07);
        --input-bg: rgba(255, 255, 255, 0.04);
        --input-border: rgba(255, 255, 255, 0.1);
        --input-focus: rgba(184, 149, 74, 0.4);
        --text-muted: rgba(255, 255, 255, 0.38);
        --text-dim: rgba(255, 255, 255, 0.22);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Outfit", sans-serif;
        background: #0f1012;
        min-height: 100vh;
        color: #e8e0d4;
        -webkit-font-smoothing: antialiased;
      }

      /* ═══════════════════════════════
   APP LAYOUT
═══════════════════════════════ */
      .app {
        display: grid;
        grid-template-columns: 700px 1fr;
        min-height: 100vh;
      }

      /* ═══════════════════════════════
   FORM PANEL
═══════════════════════════════ */
      .form-panel {
        background: linear-gradient(
          180deg,
          var(--fp-bg) 0%,
          var(--fp-bg2) 100%
        );
        border-right: 1px solid var(--fp-border);
        overflow-y: auto;
        position: sticky;
        top: 0;
        height: 100vh;
      }

      .form-header {
        padding: 22px 26px 16px;
        border-bottom: 1px solid var(--fp-border);
        background: rgba(184, 149, 74, 0.05);
        display: flex;
        align-items: center;
        gap: 13px;
      }

      .brand-icon {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        flex-shrink: 0;
        box-shadow: 0 2px 10px rgba(184, 149, 74, 0.3);
      }

      .form-header h1 {
        font-family: "Cormorant Garamond", serif;
        font-size: 18px;
        font-weight: 600;
        color: var(--gold-light);
        letter-spacing: 0.3px;
      }
      .form-header p {
        font-size: 10px;
        color: var(--text-muted);
        letter-spacing: 1.2px;
        text-transform: uppercase;
        margin-top: 1px;
      }

      .form-body {
        padding: 14px 26px 22px;
      }

      .section-label {
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--gold);
        margin: 18px 0 10px;
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(184, 149, 74, 0.18);
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .section-label::before {
        content: "";
        width: 3px;
        height: 3px;
        background: var(--gold);
        border-radius: 50%;
      }

      /* Hotel locked card */
      .hotel-locked-card {
        background: rgba(184, 149, 74, 0.06);
        border: 1px solid rgba(184, 149, 74, 0.18);
        border-radius: 7px;
        padding: 11px 13px;
        margin-bottom: 5px;
      }
      .hotel-locked-card .hl-name {
        font-family: "Cormorant Garamond", serif;
        font-size: 15px;
        font-weight: 600;
        color: var(--gold-light);
        margin-bottom: 3px;
      }
      .hotel-locked-card .hl-meta {
        font-size: 10.5px;
        color: var(--text-muted);
        line-height: 1.65;
      }

      .edit-toggle-row {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 8px;
        cursor: pointer;
        font-size: 10.5px;
        color: var(--text-dim);
        letter-spacing: 0.2px;
        user-select: none;
        padding: 3px 0;
        transition: color 0.2s;
      }
      .edit-toggle-row:hover {
        color: var(--gold);
      }

      #hotelEditFields {
        display: none;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 7px;
        padding: 13px;
        margin-bottom: 4px;
      }
      #hotelEditFields.open {
        display: block;
      }

      .btn-save-hotel {
        background: rgba(184, 149, 74, 0.1);
        border: 1px solid var(--gold);
        color: var(--gold-light);
        font-family: "Outfit", sans-serif;
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 1px;
        text-transform: uppercase;
        padding: 7px 16px;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 5px;
        transition: background 0.2s;
        width: 100%;
      }
      .btn-save-hotel:hover {
        background: rgba(184, 149, 74, 0.2);
      }

      /* Fields */
      .field {
        margin-bottom: 9px;
      }
      .field label {
        display: block;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.38);
        margin-bottom: 4px;
      }
      .field label .opt {
        color: rgba(255, 255, 255, 0.18);
        font-weight: 300;
        text-transform: none;
        letter-spacing: 0;
        margin-left: 3px;
      }

      .field input,
      .field textarea,
      .field select {
        width: 100%;
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        border-radius: 5px;
        padding: 8px 10px;
        font-family: "Outfit", sans-serif;
        font-size: 12.5px;
        color: #e8e0d4;
        outline: none;
        transition:
          border-color 0.2s,
          background 0.2s;
      }
      .field input::placeholder,
      .field textarea::placeholder {
        color: rgba(255, 255, 255, 0.15);
      }
      .field input:focus,
      .field textarea:focus {
        border-color: var(--input-focus);
        background: rgba(255, 255, 255, 0.06);
      }
      .field textarea {
        resize: vertical;
        min-height: 46px;
      }
      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }

      /* Items table in form */
      .items-table-form {
        width: 100%;
        border-collapse: collapse;
        font-size: 11.5px;
      }
      .items-table-form th {
        background: rgba(184, 149, 74, 0.08);
        color: var(--gold-light);
        font-weight: 500;
        letter-spacing: 0.5px;
        padding: 6px 6px;
        text-align: left;
        border-bottom: 1px solid rgba(184, 149, 74, 0.18);
      }
      .items-table-form td {
        padding: 3px 2px;
        vertical-align: top;
      }
      .items-table-form input {
        width: 100%;
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        border-radius: 4px;
        padding: 5px 6px;
        font-family: "Outfit", sans-serif;
        font-size: 11.5px;
        color: #e8e0d4;
        outline: none;
      }
      .items-table-form input:focus {
        border-color: var(--input-focus);
      }
      .items-table-form .col-sl {
        width: 26px;
      }
      .items-table-form .col-qty {
        width: 46px;
      }
      .items-table-form .col-rate {
        width: 62px;
      }
      .items-table-form .col-amt {
        width: 70px;
      }
      .items-table-form .col-del {
        width: 24px;
      }

      .btn-del-row {
        background: rgba(255, 60, 60, 0.12);
        border: none;
        color: rgba(255, 120, 120, 0.7);
        width: 20px;
        height: 20px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 5px;
        transition: background 0.2s;
      }
      .btn-del-row:hover {
        background: rgba(255, 60, 60, 0.28);
      }

      .btn-add-row {
        background: rgba(184, 149, 74, 0.08);
        border: 1px dashed rgba(184, 149, 74, 0.35);
        color: var(--gold-light);
        font-family: "Outfit", sans-serif;
        font-size: 11.5px;
        padding: 7px 14px;
        border-radius: 5px;
        cursor: pointer;
        width: 100%;
        margin-top: 7px;
        transition: background 0.2s;
        letter-spacing: 0.5px;
      }
      .btn-add-row:hover {
        background: rgba(184, 149, 74, 0.16);
      }

      /* Toggle */
      .toggle-field {
        display: flex;
        align-items: center;
        justify-content: space-between; /* Keeps label left, toggle right */
        gap: 12px;
        padding: 10px 12px;
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        border-radius: 5px;
        margin-bottom: 7px;
        width: 100%; /* Ensures it fills the panel width but doesn't stretch content */
      }
      .toggle-field label {
        font-size: 11.5px;
        color: rgba(255, 255, 255, 0.48);
        margin: 0;
        letter-spacing: 0;
        text-transform: none;
        cursor: pointer;
        /* flex: 1; */
      }
      .toggle {
        position: relative;
        width: 34px;
        height: 18px;
        flex-shrink: 0; /* Prevents the switch from squashing or stretching */
        display: inline-block;
      }
      .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .toggle-slider {
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.13);
        border-radius: 18px;
        cursor: pointer;
        transition: background 0.2s;
      }
      .toggle-slider::before {
        content: "";
        position: absolute;
        width: 12px;
        height: 12px;
        left: 3px;
        top: 3px;
        background: white;
        border-radius: 50%;
        transition: transform 0.2s;
      }
      .toggle input:checked + .toggle-slider {
        background: var(--gold);
      }
      .toggle input:checked + .toggle-slider::before {
        transform: translateX(14px);
      }

      /* Sign area */
      .sign-note {
        font-size: 10.5px;
        color: var(--text-dim);
        padding: 7px 0;
        line-height: 1.5;
      }

      /* Actions */
      .form-actions {
        padding: 12px 26px 26px;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .btn-primary {
        background: linear-gradient(135deg, #22402e, #2d5a40);
        border: 1px solid var(--gold);
        color: var(--gold-light);
        font-family: "Outfit", sans-serif;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 12px 22px;
        border-radius: 7px;
        cursor: pointer;
        transition: all 0.25s;
        width: 100%;
      }
      .btn-primary:hover {
        background: linear-gradient(135deg, #2d5a40, #3d7a56);
        box-shadow: 0 4px 18px rgba(184, 149, 74, 0.2);
        transform: translateY(-1px);
      }

      .btn-secondary {
        background: transparent;
        border: 1px solid rgba(184, 149, 74, 0.28);
        color: var(--gold);
        font-family: "Outfit", sans-serif;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 10px 22px;
        border-radius: 7px;
        cursor: pointer;
        transition: all 0.2s;
        width: 100%;
      }
      .btn-secondary:hover {
        background: rgba(184, 149, 74, 0.07);
      }

      /* Actions row for download/print */
      .actions-row {
        display: flex;
        gap: 7px;
      }
      .actions-row .btn-primary,
      .actions-row .btn-secondary {
        flex: 1;
      }

      /* ═══════════════════════════════
   PREVIEW PANEL
═══════════════════════════════ */
      .preview-panel {
        background: #1a1c1e;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 28px 16px;
        overflow-y: auto;
      }

      .preview-label {
        font-size: 9.5px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.24);
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .preview-label::before,
      .preview-label::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(255, 255, 255, 0.07);
        max-width: 90px;
      }

      /* Invoice pages container */
      #invoicesContainer {
        display: flex;
        flex-direction: column;
        gap: 18px;
        align-items: center;
      }

      /* ═══════════════════════════════
   THE INVOICE (shared styles)
═══════════════════════════════ */
      .inv-page {
        width: 794px;
        min-height: 1123px;
        background: var(--cream);
        box-shadow:
          0 16px 60px rgba(0, 0, 0, 0.55),
          0 3px 16px rgba(0, 0, 0, 0.35);
        border-radius: 2px;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        color: var(--ink);
        font-family: "Outfit", sans-serif;
        page-break-after: always;
      }

      .inv-topbar {
        height: 5px;
        background: linear-gradient(
          90deg,
          var(--forest) 0%,
          var(--forest-mid) 35%,
          var(--gold) 72%,
          var(--gold-pale) 100%
        );
        flex-shrink: 0;
      }

      .inv-watermark {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(-28deg);
        font-family: "Cormorant Garamond", serif;
        font-size: 88px;
        font-weight: 700;
        color: rgba(26, 58, 42, 0.04);
        white-space: nowrap;
        pointer-events: none;
        user-select: none;
        letter-spacing: 8px;
        z-index: 0;
      }

      .inv-content {
        position: relative;
        z-index: 1;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      /* ── Invoice Header ── */
      .inv-header {
        padding: 22px 32px 17px;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        border-bottom: 1.5px solid var(--border);
      }

      .inv-hotel-left {
        display: flex;
        align-items: flex-start;
        gap: 13px;
      }

      .inv-logo-box {
        width: 70px;
        height: 70px;
        background: linear-gradient(
          135deg,
          var(--forest) 0%,
          var(--forest-light) 100%
        );
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        overflow: hidden;
      }
      /* .inv-logo-box .logo-placeholder {
        font-size: 24px;
      } */
      .inv-logo-box img {
        display: block;
        width: 120%;
        height: 120%;
        object-fit: contain; /* Keeps the logo's aspect ratio */
      }

      .inv-hotel-info h2 {
        font-family: "Cormorant Garamond", serif;
        font-size: 22px;
        font-weight: 700;
        color: var(--forest);
        letter-spacing: 0.3px;
        line-height: 1.1;
      }
      .inv-hotel-info .tagline {
        font-size: 10.5px;
        font-style: italic;
        color: var(--ink-light);
        letter-spacing: 0.3px;
        margin-top: 2px;
        font-family: "Cormorant Garamond", serif;
      }
      .inv-hotel-info .meta {
        margin-top: 6px;
        font-size: 10.5px;
        color: var(--ink-mid);
        line-height: 1.7;
      }
      .gst-badge {
        display: inline-block;
        background: rgba(26, 58, 42, 0.09);
        color: var(--forest);
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.3px;
        padding: 2px 6px;
        border-radius: 3px;
        margin-right: 3px;
        margin-top: 1px;
      }

      .inv-header-right {
        text-align: right;
        flex-shrink: 0;
      }
      .inv-receipt-badge {
        background: linear-gradient(135deg, var(--forest), var(--forest-mid));
        color: var(--gold-pale);
        font-family: "Cormorant Garamond", serif;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 4px;
        padding: 6px 16px;
        border-radius: 4px;
        text-transform: uppercase;
        margin-bottom: 9px;
        display: inline-block;
      }
      .inv-meta-grid {
        font-size: 11.5px;
        color: var(--ink-mid);
        line-height: 1.95;
      }
      .inv-meta-grid span {
        color: var(--forest);
        font-weight: 600;
      }

      /* ── PAID STAMP ── */
      .paid-stamp {
        position: absolute;
        top: 40px;
        right: 220px;
        width: 100px;
        height: 100px;
        /* Double border for a more official look */
        border: 4px double rgba(22, 120, 55, 0.8);
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transform: rotate(-22deg);
        opacity: 0.85;
        pointer-events: none;
        z-index: 10;
        /* The Secret Sauce: Grunge effect using a CSS noise mask */
        mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background: rgba(22, 120, 55, 0.03);
      }
      .paid-stamp .stamp-text {
        font-family: "Outfit", sans-serif;
        font-size: 22px;
        font-weight: 800;
        color: rgba(22, 120, 55, 0.9);
        letter-spacing: 2px;
        text-transform: uppercase;
        line-height: 1;
        /* Slight blur to mimic ink bleeding into paper */
        text-shadow: 0 0 1px rgba(22, 120, 55, 0.4);
      }
      .paid-stamp .stamp-sub {
        font-size: 9px;
        font-weight: 700;
        color: rgba(22, 120, 55, 0.8);
        letter-spacing: 1.5px;
        margin-top: 4px;
        border-top: 1px solid rgba(22, 120, 55, 0.5);
        padding-top: 2px;
      }

      /* ── Guest + Meta (compact 2-col) ── */
      .inv-guest-section {
        padding: 10px 32px;
        background: rgba(26, 58, 42, 0.025);
        border-bottom: 1px solid var(--border);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .inv-guest-box h4 {
        font-size: 8px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--forest-light);
        margin-bottom: 4px;
        padding-bottom: 3px;
        border-bottom: 1px solid rgba(26, 58, 42, 0.13);
      }
      .inv-guest-box p {
        font-size: 11.5px;
        color: var(--ink-mid);
        line-height: 1.65;
      }
      .inv-guest-box p strong {
        color: var(--ink);
        font-weight: 600;
        font-size: 13px;
      }

      /* ── Stay ribbon ── */
      .inv-stay-ribbon {
        padding: 6px 32px;
        background: linear-gradient(
          90deg,
          rgba(26, 58, 42, 0.05) 0%,
          rgba(184, 149, 74, 0.05) 100%
        );
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 22px;
        align-items: center;
        flex-wrap: wrap;
      }
      .inv-stay-item {
        font-size: 10.5px;
        color: var(--ink-light);
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .inv-stay-item span {
        color: var(--ink);
        font-weight: 500;
      }

      /* ── Table ── */
      .inv-table-wrap {
        padding: 14px 32px;
        flex: 1;
      }
      .inv-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
      }
      .inv-table thead tr {
        background: linear-gradient(
          90deg,
          var(--forest) 0%,
          var(--forest-mid) 100%
        );
        color: var(--gold-pale);
      }
      .inv-table thead th {
        padding: 9px 10px;
        font-weight: 500;
        font-size: 9px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        text-align: left;
      }
      .inv-table thead th:last-child,
      .inv-table thead th:nth-child(3),
      .inv-table thead th:nth-child(4) {
        text-align: right;
      }

      .inv-table tbody tr {
        border-bottom: 1px solid rgba(212, 201, 176, 0.45);
      }
      .inv-table tbody tr:last-child {
        border-bottom: none;
      }
      .inv-table tbody tr:nth-child(even) {
        background: rgba(26, 58, 42, 0.025);
      }
      .inv-table tbody td {
        padding: 9px 10px;
        color: var(--ink-mid);
        vertical-align: top;
      }
      .inv-table tbody td:first-child {
        color: var(--ink-light);
        font-size: 11px;
        text-align: center;
      }
      .inv-table tbody td:nth-child(3),
      .inv-table tbody td:nth-child(4) {
        text-align: right;
      }
      .inv-table tbody td:last-child {
        text-align: right;
        font-weight: 500;

          return s ? { ...DEFAULTS, ...JSON.parse(s) } : { ...DEFAULTS };
        } catch (e) {
          return { ...DEFAULTS };

      function saveHotelDetails() {
        const keys = [
          "hotelName",
          "hotelTagline",
          "hotelAddress",
          "hotelPhone1",
          "hotelPhone2",
          "hotelEmail",

          "bankName",

        const p2 = document.getElementById("hotelPhone2")?.value || "";

      /* ═══════════════════════════════════════════════
   ROWS
═══════════════════════════════════════════════ */
      function addRow(part = "", qty = "", rate = "") {
        rowCount++;
        const n = rowCount;
        const tr = document.createElement("tr");
        tr.id = `fr${n}`;
        tr.innerHTML = `
    <td class="col-sl"><input value="${n}" readonly style="text-align:center;color:rgba(255,255,255,0.22)"></td>
    <td class="col-part"><input type="text" value="${part}" placeholder="e.g. Room + Breakfast" oninput="calcRow(${n})"></td>
    <td class="col-qty"><input type="number" min="0" value="${qty}" placeholder="1" oninput="calcRow(${n})" style="text-align:center"></td>
    <td class="col-rate"><input type="number" min="0" value="${rate}" placeholder="0" oninput="calcRow(${n})" style="text-align:right"></td>
    <td class="col-amt"><input type="number" id="amt${n}" readonly placeholder="0" style="text-align:right;background:rgba(184,149,74,0.07);color:var(--gold-light)"></td>
    <td class="col-del"><button class="btn-del-row" onclick="delRow(${n})">×</button></td>
  `;
        document.getElementById("itemsBody").appendChild(tr);
        if (qty && rate) calcRow(n);
      }

      function calcRow(n) {
        const tr = document.getElementById(`fr${n}`);
        if (!tr) return;
        const inp = tr.querySelectorAll("input");
        const qty = parseFloat(inp[2].value) || 0;
        const rate = parseFloat(inp[3].value) || 0;
        inp[4].value = qty * rate > 0 ? (qty * rate).toFixed(2) : "";
        updateInvoice();
      }

      function delRow(n) {
        document.getElementById(`fr${n}`)?.remove();
        updateInvoice();
      }

      /* ═══════════════════════════════════════════════
   NUMBER TO WORDS
═══════════════════════════════════════════════ */
      const W1 = [
        "",
        "One",
        "Two",
        "Three",
        "Four",
        "Five",
        "Six",
        "Seven",
        "Eight",
        "Nine",
        "Ten",
        "Eleven",
        "Twelve",
        "Thirteen",
        "Fourteen",
        "Fifteen",
        "Sixteen",
        "Seventeen",
        "Eighteen",
        "Nineteen",
      ];
      const W10 = [
        "",
        "",
        "Twenty",
        "Thirty",
        "Forty",
        "Fifty",
        "Sixty",
        "Seventy",
        "Eighty",
        "Ninety",
      ];

      function n2w(n) {
        n = Math.round(n);
        if (!n) return "Zero";
        function b1k(n) {
          if (!n) return "";
          if (n < 20) return W1[n] + " ";
          if (n < 100)
            return (
              W10[Math.floor(n / 10)] + (n % 10 ? " " + W1[n % 10] : "") + " "
            );
          return W1[Math.floor(n / 100)] + " Hundred " + b1k(n % 100);
        }
        let r = "";
        if (n >= 10000000) {
          r += b1k(Math.floor(n / 10000000)) + "Crore ";
          n %= 10000000;
        }
        if (n >= 100000) {
          r += b1k(Math.floor(n / 100000)) + "Lakh ";
          n %= 100000;
        }
        if (n >= 1000) {
          r += b1k(Math.floor(n / 1000)) + "Thousand ";
          n %= 1000;
        }
        return (r + b1k(n)).trim();
      }

      function amt2w(a) {
        const rp = Math.floor(a),
          ps = Math.round((a - rp) * 100);
        return (
          n2w(rp) +
          " Rupees" +
          (ps > 0 ? " and " + n2w(ps) + " Paise" : "") +
          " Only"
        );
      }

      /* ═══════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════ */
      function fmtD(s) {
        if (!s) return "—";
        const d = new Date(s + "T00:00:00");
        return d.toLocaleDateString("en-IN", {
          day: "2-digit",
          month: "short",
          year: "numeric",
        });
      }
      function fmtN(n) {
        return new Intl.NumberFormat("en-IN", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(n);
      }
      function v(id) {
        return (document.getElementById(id)?.value || "").trim();
      }

      /* ═══════════════════════════════════════════════
   BUILD HTML FOR INVOICE PARTS (reusable)
═══════════════════════════════════════════════ */
      function getHotelMetaHTML() {
        let mH = "";
        if (v("hotelAddress")) mH += `<div>📍 ${v("hotelAddress")}</div>`;
        const ph = [v("hotelPhone1"), v("hotelPhone2")]
          .filter(Boolean)
          .join(" / ");
        if (ph) mH += `<div>📞 ${ph}</div>`;
        if (v("hotelEmail")) mH += `<div>✉ ${v("hotelEmail")}</div>`;
        const badges = [
          v("hotelGst")
            ? `<span class="gst-badge">GSTIN: ${v("hotelGst")}</span>`
            : "",
          v("tacNo")
            ? `<span class="gst-badge">TAC No.: ${v("tacNo")}</span>`
            : "",
        ]
          .filter(Boolean)
          .join("");
        if (badges) mH += `<div>${badges}</div>`;
        return mH;
      }

        const gn = v("guestName");
        if (!gn)
          return '<em style="color:#aaa;font-size:10.5px;">Fill in guest details →</em>';
        let h = `<p><strong>${gn}</strong></p>`;
        if (v("guestAddress")) h += `<p>${v("guestAddress")}</p>`;
        if (v("guestPhone")) h += `<p>📞 ${v("guestPhone")}</p>`;

        return h;
      }

      function getStayRibbonHTML() {
        const ci = v("checkIn"),
          co = v("checkOut");
        if (!ci && !co) return "";
        let h = "";
        if (ci)
          h += `<div class="inv-stay-item">🛬 Check-in: <span>${fmtD(ci)}</span></div>`;
        if (co)
          h += `<div class="inv-stay-item">🛫 Check-out: <span>${fmtD(co)}</span></div>`;
        if (ci && co) {
          const nts = Math.round((new Date(co) - new Date(ci)) / 86400000);
          if (nts > 0)
            h += `<div class="inv-stay-item">🌙 <span>${nts} Night${nts > 1 ? "s" : ""}</span></div>`;
        }
        return h;
      }

      function getAllItems() {
        const items = [];
        document.querySelectorAll("#itemsBody tr").forEach((row) => {
          const inp = row.querySelectorAll("input");
          const pt = inp[1]?.value?.trim();
          const qt = parseFloat(inp[2]?.value);
          const rt = parseFloat(inp[3]?.value);
          const am = parseFloat(inp[4]?.value) || 0;
          if (!pt && !qt && !rt) return;
          items.push({
            pt: pt || "—",
            qt: isNaN(qt) ? "—" : qt,
            rt: isNaN(rt) ? "—" : rt,
            am,
          });
        });
        return items;
      }

      function buildTableRows(items, startSlNo) {
        if (!items.length)
          return '<tr><td colspan="5" style="text-align:center;color:#aaa;padding:16px;font-style:italic">Add billing items →</td></tr>';
        return items
          .map(
            (item, i) => `
    <tr>
      <td>${startSlNo + i}</td>
      <td>${item.pt}</td>
      <td style="text-align:right">${item.qt}</td>
      <td style="text-align:right">${item.rt !== "—" ? "₹" + fmtN(item.rt) : "—"}</td>
      <td>₹${fmtN(item.am)}</td>
    </tr>
  `,
          )
          .join("");
      }

      function buildTotalsHTML(sub, applyGst) {
        const gstRate = sub > 7500 ? 18 : 5;
        // Calculation stays the same, but we don't hide the row
        const gstAmt = applyGst ? sub * (gstRate / 100) : 0;
        const grand = sub + gstAmt;

        let h = `<div class="inv-total-row"><span>Subtotal</span><span>₹${fmtN(sub)}</span></div>`;

        // Always show the row, just show 0 if applyGst is false
        h += `<div class="inv-total-row tax-row" style="${!applyGst ? "opacity: 0.6;" : ""}">
                <span>GST (${gstRate}%)</span>
                <span>₹${fmtN(gstAmt)}</span>
              </div>`;

        h += `<div class="inv-total-row grand"><span>Grand Total</span><span>₹${fmtN(grand)}</span></div>`;
        return { html: h, grand };
      }

        const bH = v("bankHolder"),

      /* ═══════════════════════════════════════════════

═══════════════════════════════════════════════ */
      function printInvoice() {
        // This ensures the background colors and fonts show up in the print window
        const style = document.createElement("style");
        style.innerHTML = `
          @media print {
            body { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .inv-page { box-shadow: none !important; border: none !important; margin: 0 !important; }
          }
        `;
        document.head.appendChild(style);
        window.print();
        style.remove();
      }

      function downloadPDF() {
        const element = document.getElementById("invoicesContainer");

        // Temporarily force container width for the capture
        const originalStyle = element.style.width;
        element.style.width = "794px";

        const opt = {
          margin: 0,
          filename: `Invoice_${v("receiptNo") || "New"}.pdf`,
          image: { type: "jpeg", quality: 1 },
          html2canvas: {
            scale: 2,
            useCORS: true,
            logging: false,
            letterRendering: true,
            width: 794, // Strict width to prevent horizontal margin shift
          },
          jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
          pagebreak: { mode: ["avoid-all", "css", "legacy"] },
        };

        html2pdf()
          .set(opt)
          .from(element)
          .save()
          .then(() => {
            element.style.width = originalStyle; // Restore style after download
          });
      }

      /* ═══════════════════════════════════════════════
   RESET
═══════════════════════════════════════════════ */
      function resetForm() {
        if (!confirm("Clear this invoice and start fresh?")) return;
        [
          "receiptNo",
          "guestName",
          "guestAddress",
          "guestPhone",
          "guestAadhaar",
          "guestPan",
          "guestGst",
          "checkIn",
          "checkOut",
        ].forEach((id) => {
          const el = document.getElementById(id);
          if (el) el.value = "";
        });
        document.getElementById("receiptDate").value = new Date()
          .toISOString()
          .split("T")[0];
        document.getElementById("receiptNo").value = "000";
        document.getElementById("paidToggle").checked = false;
        document.getElementById("itemsBody").innerHTML = "";
        rowCount = 0;
        addRow();
        addRow();
        updateInvoice();
      }

      /* ═══════════════════════════════════════════════
   INIT (PREVIOUS LOGIC MOVED TO unlockApp)

    </script>
