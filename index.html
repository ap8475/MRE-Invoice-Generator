<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mountain Retreat Ecostay — Document Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{--forest:#1a3a2a;--forest-mid:#2d5a40;--gold:#b8954a;--gold-light:#d4aa6a;--gold-pale:#e8c98a;--bg:#0f1012;--panel:#1c1f22;--muted:rgba(255,255,255,.48);--border:rgba(184,149,74,.22)}
    *{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:radial-gradient(circle at top,rgba(184,149,74,.12),transparent 34%),linear-gradient(135deg,#0f1012,#17191b 60%,#111713);font-family:Outfit,sans-serif;color:#eee2d4}.hidden{display:none!important}
    .lock{height:100vh;display:grid;place-items:center;padding:22px}.lock-card{width:min(350px,94vw);background:linear-gradient(180deg,rgba(28,31,34,.96),rgba(16,17,19,.96));border:1px solid var(--border);border-radius:22px;padding:32px;text-align:center;box-shadow:0 28px 80px rgba(0,0,0,.55)}.logo{width:128px;height:128px;object-fit:contain;margin:0 auto 6px;display:block}.lock h1{font-family:"Cormorant Garamond",serif;color:var(--gold-light);font-size:30px}.lock p{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:2px;margin:7px 0 22px}.lock input{width:100%;padding:13px;border-radius:9px;background:#0f1012;border:1px solid rgba(255,255,255,.1);color:white;text-align:center;outline:none}.btn{margin-top:15px;width:100%;padding:13px;border-radius:10px;background:linear-gradient(135deg,var(--forest),var(--forest-mid));border:1px solid var(--gold);color:var(--gold-pale);font-weight:600;letter-spacing:1.4px;text-transform:uppercase;cursor:pointer}.btn:hover{box-shadow:0 10px 28px rgba(184,149,74,.2)}
    .portal{min-height:100vh;padding:30px clamp(18px,4vw,58px)}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:54px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:72px;height:72px;object-fit:contain}.brand-title{font-family:"Cormorant Garamond",serif;font-size:27px;color:var(--gold-light)}.brand-sub{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}.logout{width:auto;margin:0;padding:9px 14px;background:transparent;color:var(--gold);border:1px solid rgba(184,149,74,.35)}
    .hero{text-align:center;margin:0 auto 34px}.hero h2{font-family:"Cormorant Garamond",serif;font-size:50px;color:var(--gold-light);font-weight:600;line-height:1}.hero p{margin-top:9px;color:var(--muted);font-size:14px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;max-width:1050px;margin:0 auto}.card{text-decoration:none;color:inherit;min-height:230px;border:1px solid var(--border);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));padding:26px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 22px 65px rgba(0,0,0,.32);transition:.22s}.card:hover{transform:translateY(-4px);border-color:rgba(212,170,106,.58)}.icon{font-size:31px}.card h3{font-family:"Cormorant Garamond",serif;color:var(--gold-light);font-size:30px;margin-top:18px}.open{color:var(--gold-pale);font-size:12px;text-transform:uppercase;letter-spacing:1.5px;margin-top:22px}.small{max-width:820px;margin:30px auto 0;text-align:center;color:rgba(255,255,255,.3);font-size:12px}@media(max-width:900px){.cards{grid-template-columns:1fr}.hero h2{font-size:38px}.top{align-items:flex-start}}
    .card.disabled {
        pointer-events: none; 
        opacity: 0.5;         
        cursor: not-allowed;
    }
  </style>
</head>
<body>
  <section id="lock" class="lock">
    <div class="lock-card">
      <img src="logo.png" class="logo" alt="Logo" onerror="this.style.display='none'" />
      <h1>Document Studio</h1>
      <p>Mountain Retreat Ecostay</p>
      <input id="passInput" type="password" placeholder="Access Code" autocomplete="off" />
      <button class="btn" onclick="unlock()">Unlock</button>
    </div>
  </section>
  <main id="portal" class="portal hidden">
    <div class="top">
      <div class="brand"><img src="logo.png" alt="Logo" onerror="this.style.display='none'"><div><div class="brand-title">Mountain Retreat Ecostay</div><div class="brand-sub">PDF Generator</div></div></div>
      <button class="btn logout" onclick="lockAgain()">Lock</button>
    </div>
    <section class="hero"><h2>Select Form</h2><p>Choose a document generator.</p></section>
    <section class="cards">
      <a class="card" href="invoice.html"><div><div class="icon">🧾</div><h3>Invoice</h3></div><div class="open">Open →</div></a>
      <a class="card" href="marriage-quotation.html"><div><div class="icon">💍</div><h3>Marriage Quotation</h3></div><div class="open">Open →</div></a>
      <a class="card disabled" href="travel-plan.html"><div><div class="icon">🏔️</div><h3>Travel Plan</h3></div><div class="open">Open →</div></a>
    </section>
  </main>
<script>
  const PASS="MRE2026";
  function unlock(){const p=document.getElementById('passInput').value;if(p===PASS){sessionStorage.setItem('mre_portal_unlocked','yes');showPortal()}else{alert('Unauthorized Access.');document.getElementById('passInput').value=''}}
  function showPortal(){document.getElementById('lock').classList.add('hidden');document.getElementById('portal').classList.remove('hidden')}
  function lockAgain(){sessionStorage.removeItem('mre_portal_unlocked');location.reload()}
  document.getElementById('passInput').addEventListener('keypress',e=>{if(e.key==='Enter')unlock()});
  if(sessionStorage.getItem('mre_portal_unlocked')==='yes')showPortal();
</script>
</body>
</html>
